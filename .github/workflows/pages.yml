name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege. Pages needs an OIDC token to mint a deployment and write access
# to publish. Everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never race two deploys; let a queued one finish rather than cancelling it
# mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Regenerates everything .gitignore excludes: vendor/, fonts, fonts.css.
      - name: Setup
        run: bun run setup

      # Bundles src + vendor + styles into dist/ (a handful of files).
      - name: Build
        run: bun run build

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
